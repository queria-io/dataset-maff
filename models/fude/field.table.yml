schema: fude
name: field
title: 筆ポリゴン（農地の区画）
description: |-
  農地の区画です。1 行が田か畑の 1 枚で、区画の形と農業集落コードを持ちます。

  - 航空写真・衛星画像の判読で描いた区画で、土地の権利関係や筆界を示すものではありません。登記の筆（moj）とは 1 対 1 になりません
  - polygon_uuid は年度ごとに振り直されます
  - 農業集落コードは区画の重心が入る農業集落です
primary_key: [polygon_uuid]
sources:
  - path: https://www.maff.go.jp/j/tokei/census/shuraku_data/2025/mb/index.html
  - path: https://www.maff.go.jp/j/tokei/porigon/
fields:
  - name: polygon_uuid
    title: 筆ポリゴン ID
    description: 原典の UUID。年度ごとに振り直されます
  - name: land_type
    title: 耕地の種類のコード
    description: 100 が田、200 が畑
    extensions: { queria: { semantic: { role: dimension } } }
  - name: land_type_name
    title: 耕地の種類
    description: 田 / 畑
    extensions: { queria: { semantic: { role: dimension } } }
  - name: agricultural_community_code
    title: 農業集落コード
    description: 10 桁。市区町村 5 桁・旧市区町村 2 桁・農業集落 3 桁
  - name: city_code
    title: 市区町村コード（5 桁）
    description: 農業集落コードの先頭 5 桁（検査数字なし）
    extensions: { queria: { semantic: { role: entity, name: city } } }
  - name: lg_code
    title: 全国地方公共団体コード
    description: city_code に検査数字を付けた 6 桁
    extensions: { queria: { semantic: { role: entity, name: city } } }
  - name: issue_year
    title: 公開年度
  - name: lng
    title: 重心の経度
  - name: lat
    title: 重心の緯度
  - name: geometry
    title: 区画の形
    description: マルチポリゴン（経緯度）
