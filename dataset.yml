# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・列の意味）は extensions.queria に書く。
name: maff
title: 農林水産省 筆ポリゴン（農地の区画）
description: |-
  農林水産省の筆ポリゴン（2026年度公開）。全国の田と畑を 1 枚ずつ区画の形で持ち、田か畑か、重心の経緯度、区画が入る農業集落のコードが付いている。
  農地の場所と広さを地図で見る、市区町村や農業集落ごとに田畑の数や面積を数える、農林業センサスの農業集落別の数字と重ねる、といった使い方ができる。
  区画は航空写真・衛星画像を目視で判読して描いたもので、土地の権利関係や筆界を示すものではない。

  出典：「筆ポリゴンデータ（2026年度公開）」（農林水産省）。Queria が農業集落コード付きの FlatGeobuf を表に加工して作成したもので、国が作成したものではない。
  筆ポリゴンの利用規約（政府標準利用規約 第2.0版に準拠）により、使うときは出典と、加工したものであることを書くこと。
keywords:
  - 筆ポリゴン
  - 農地
  - 耕地
  - 田
  - 畑
  - 区画
  - 農業集落
  - 農林業センサス
  - 農林水産省
homepage: https://github.com/queria-io/dataset-maff
language: ja
licenses:
  - CC-BY-4.0
sources:
  - title: 地域の農業を見て・知って・活かすDB 筆ポリゴンデータ
    path: https://www.maff.go.jp/j/tokei/census/shuraku_data/2025/mb/index.html
  - title: 農地の区画情報（筆ポリゴン）のデータ提供・利用
    path: https://www.maff.go.jp/j/tokei/porigon/
contributors:
  - title: 農林水産省
    path: https://www.maff.go.jp/
    roles: [rightsHolder]
spatial_coverage: [JP]
update_frequency: annual
schemas:
  - name: fude
    title: 筆ポリゴン
extensions:
  queria:
    themes: [agriculture, land_climate]
    cover: 🌾
