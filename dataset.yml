# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・列の意味）は extensions.queria に書く。
name: maff
title: 農林水産省 筆ポリゴン（農地の区画）
description: |-
  農林水産省の筆ポリゴン（2026年度公開）です。全国の田と畑を 1 枚ずつ区画の形で収録し、田か畑か、重心の経緯度、区画が入る農業集落のコードを持ちます。

  出典：「筆ポリゴンデータ（2026年度公開）」（農林水産省）。Queria が加工したものです。
keywords:
  - 筆ポリゴン
  - 農地
  - 耕地
  - 田
  - 畑
  - 区画
  - 農業集落
  - 農林業センサス
  - 農林水産省
homepage: https://github.com/queria-io/dataset-maff
language: ja
licenses:
  - CC-BY-4.0
sources:
  - title: 地域の農業を見て・知って・活かすDB 筆ポリゴンデータ
    path: https://www.maff.go.jp/j/tokei/census/shuraku_data/2025/mb/index.html
  - title: 農地の区画情報（筆ポリゴン）のデータ提供・利用
    path: https://www.maff.go.jp/j/tokei/porigon/
contributors:
  - title: 農林水産省
    path: https://www.maff.go.jp/
    roles: [rightsHolder]
spatial_coverage: [JP]
update_frequency: yearly
schemas:
  - name: fude
    title: 筆ポリゴン
extensions:
  queria:
    themes: [agriculture, land_climate]
    cover: 🌾
