name: Build

# 公開せずにパイプラインと dbt build だけを回す。全国は zip が 5.4GB あるので、
# 東京都と神奈川県だけ取って形を確かめる
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run python -c "import main; main.download_fude()"
        env:
          MAFF_PREFECTURES: "13,14"
      - run: uv run dbt build --profiles-dir ci
